l_simp_chinese:
 building_potala:0 "布达拉宫"
 building_potala_desc:0 "坐落于拉萨红山之巅的宏伟宫殿，是藏传佛教的圣地与西藏的精神象征。"
 pm_default_building_potala:0 "布达拉宫"
 building_terracotta_army:0 "兵马俑"
 building_terracotta_army_desc:0 "秦始皇陵墓中沉睡了千年的陶俑军团，是古代军事力量的宏伟象征。"
 pm_default_building_terracotta_army:0 "兵马俑"
 building_mogao_caves:0 "莫高窟"
 building_mogao_caves_desc:0 "坐落于河西走廊西端的佛教艺术宝库，千佛洞中保存了跨越数个朝代的壁画与彩塑，是丝绸之路文化交流的不朽丰碑。"
 pm_default_building_mogao_caves:0 "莫高窟"
 building_crystal_palace:0 "水晶宫"
 building_crystal_palace_desc:0 "1851年万国工业博览会的举办地，以钢铁与玻璃构筑的宏伟殿堂，象征着维多利亚时代英国工业文明的巅峰。"
 pm_default_building_crystal_palace:0 "水晶宫"
 building_reichstag:0 "帝国议会大厦"
 building_reichstag_desc:0 "柏林的心脏，德意志统一的象征。这座宏伟建筑见证了德意志民族从分裂走向统一的伟大历程。"
 pm_default_building_reichstag:0 "帝国议会大厦"
 building_st_pauls_church:0 "法兰克福圣保罗教堂"
 building_st_pauls_church_desc:0 "1848年德意志国民议会的诞生地，自由与统一的象征。在这座圆顶教堂中，德国的民主之梦首次被正式书写。"
 pm_default_building_st_pauls_church:0 "法兰克福圣保罗教堂"
 building_buckingham_palace:0 "白金汉宫"
 building_buckingham_palace_desc:0 "大英帝国的心脏，王室威严的象征。这座宫殿见证了一个日不落帝国的辉煌与荣耀，其外交斡旋能力举世无双，附属国难以摆脱其影响。"
 pm_default_building_buckingham_palace:0 "白金汉宫"
 building_Ise:0 "伊势神宫"
 building_Ise_desc:0 "日本神道最神圣的所在，供奉天照大神的古老神社。每二十年一次的式年迁宫仪式传承着千年不变的传统与匠心。"
 pm_default_building_Ise:0 "伊势神宫"
 building_parliament:0 "帝国议会厅"
 building_parliament_desc:0 "坐落于布达佩斯多瑙河畔的哥特复兴式建筑，奥匈帝国立法权力的象征。"
 pm_default_building_parliament:0 "帝国议会厅"
 building_swan:0 "新天鹅堡"
 building_swan_desc:0 "巴伐利亚群山中的童话城堡，路德维希二世倾尽王国财富打造的浪漫主义杰作。"
 pm_default_building_swan:0 "新天鹅堡"
 building_winter:0 "冬宫"
 building_winter_desc:0 "圣彼得堡的心脏，罗曼诺夫王朝的权力中心。艾尔米塔什博物馆收藏着世界上最伟大的艺术珍品。"
 pm_default_building_winter:0 "冬宫"
 building_Broadway:0 "百老汇"
 building_Broadway_desc:0 "纽约曼哈顿的娱乐圣地，从歌剧到音乐剧，这里汇聚了美国最璀璨的舞台艺术。"
 pm_default_building_Broadway:0 "百老汇"
 building_Notre_Dame:0 "巴黎圣母院"
 building_Notre_Dame_desc:0 "塞纳河畔的哥特建筑杰作，法兰西八百年的信仰中心。教会的声望为国家带来巨大的权威，朝圣者从世界各地慕名而来。"
 pm_default_building_Notre_Dame:0 "巴黎圣母院"
 building_Hollywood:0 "好莱坞"
 building_Hollywood_desc:0 "世界电影工业的心脏，从默片到彩色长片，无数经典在此诞生，塑造了全球数十亿人的梦想。"
 pm_default_building_Hollywood:0 "好莱坞"
 building_Versailles:0 "凡尔赛宫"
 building_Versailles_desc:0 "太阳王的辉煌殿堂，法国绝对君主制的巅峰象征。镜厅中的水晶吊灯照亮了欧洲外交的数百年历史。"
 pm_default_building_Versailles:0 "凡尔赛宫"
 building_Uffizi:0 "乌菲兹美术馆"
 building_Uffizi_desc:0 "文艺复兴的艺术圣殿，达芬奇、米开朗基罗与波提切利的杰作在此永恒。"
 pm_default_building_Uffizi:0 "乌菲兹美术馆"
 building_Venice:0 "威尼斯军械库"
 building_Venice_desc:0 "地中海最强海上共和国的工业心脏，流水线造船的先驱，曾一日下水一艘桨帆船。"
 pm_default_building_Venice:0 "威尼斯军械库"
 building_soviet:0 "苏维埃宫"
 building_soviet_desc:0 "莫斯科河畔的宏伟蓝图，曾经计划以415米的高度超越帝国大厦，成为世界上最高的建筑。"
 pm_default_building_soviet:0 "苏维埃宫"
 building_Aswan:0 "阿斯旺大坝"
 building_Aswan_desc:0 "尼罗河上的现代奇迹，改变了埃及几千年的洪水节律，为这个古老国度带来了源源不断的电力。"
 pm_default_building_Aswan:0 "阿斯旺大坝"
 building_Jerusalem:0 "圣殿山"
 building_Jerusalem_desc:0 "三教圣地，信仰的十字路口。从所罗门王的圣殿到今日的哭墙与圆顶清真寺，数千年从未停止吸引朝圣者的脚步。"
 pm_default_building_Jerusalem:0 "圣殿山"
 building_Mecca:0 "禁寺"
 building_Mecca_desc:0 "伊斯兰教最神圣的所在，天房克尔白的所在之处。每年数百万穆斯林朝觐的终极目的地。"
 pm_default_building_Mecca:0 "禁寺"
 building_Madrid:0 "马德里皇宫"
 building_Madrid_desc:0 "伊比利亚半岛上最宏伟的皇家宫殿，西班牙波旁王朝的权力所在。"
 pm_default_building_Madrid:0 "马德里皇宫"
 building_stonehenge:0 "巨石阵"
 building_stonehenge_desc:0 "威尔特郡旷野中屹立了四千五百年的史前奇迹。巨大的砂岩圈至今仍让世人猜测不已——是天文台，还是德鲁伊的圣殿？"
 pm_default_building_stonehenge:0 "巨石阵"
 building_Bank_of_Manhattan:0 "曼哈顿银行大厦"
 building_Bank_of_Manhattan_desc:0 "该建筑于1930年竣工,是当时世界上最高的建筑之一"
 pm_default_building_Bank_of_Manhattan:0 "曼哈顿银行大厦"
 bretton_woods_system:0 "布雷顿森林体系"
 bretton_woods.1.t: "布雷顿森林体系"
 bretton_woods.1.d: "曼哈顿银行大厦的落成标志着我国已成为世界金融中心。全球各国纷纷将本国货币与美元挂钩，一个以美元为核心的国际货币体系正式确立。"
 bretton_woods.1.f: "开启布雷顿森林体系"
 bretton_woods.1.a: "确立美元霸权"
je_sino_russian_alliance_rus:0 "中俄互助"
 je_sino_russian_alliance_rus_reason:0 "[ROOT.GetCountry.GetName]与[SCOPE.sCountry('CHI').GetName]的友谊源远流长。在共同的国际局势下，两国决定携手共进，在工业和矿产领域展开深度合作。\n\n两国同盟关系将为我们的工业发展带来新的机遇，矿产开采效率得到显著提升，更多的企业也有机会获得国家特许状而成立。\n\n#bold 若同盟破裂，本协议将自动失效#!"
